# BLE/Classic HID Host Configuration

[paths]
cache_dir = /mnt/us/kindle_hid_passthrough/cache
devices_config = /mnt/us/kindle_hid_passthrough/devices.conf

[connection]
reconnect_delay = 5
hci_reset_timeout = 10
connect_timeout = 30
transport_timeout = 30

[transport]
# hci_transport = file:/dev/stpbt

[device]
name = Kindle-HID
address = F0:F0:F0:F0:F0:F0

[protocol]
# Default protocol: ble or classic
type = classic

[quirks]
# Remotes that fake a touchscreen swipe instead of sending a key: their only
# input is a Digitizer collection, which has to be stripped before the
# descriptor reaches uhid, leaving the device with an input node that never
# fires. Turning each stroke into a key press makes them usable.
#   auto - on for devices whose *first* collection is a digitizer (default)
#   on   - on for any device with a digitizer collection
#   off  - never
# digitizer_keys = auto

# Which key each stroke sends. Blank leaves that stroke unmapped.
# One of: right left up down enter pageup pagedown space home end escape
# swipe_right = right
# swipe_left = left
# swipe_down = down
# swipe_up = up
# tap = enter

# Per-device override, by address:
# [device:00:00:00:A1:90:19]
# digitizer_keys = on

[logging]
log_file = /var/log/hid_passthrough.log
